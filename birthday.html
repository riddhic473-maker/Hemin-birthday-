<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday, Hemin ♡</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background:
            radial-gradient(circle at 10% 15%, #f4d7dc 0, transparent 25%),
            radial-gradient(circle at 90% 20%, #f2d5cf 0, transparent 25%),
            radial-gradient(circle at 50% 100%, #f6e1d9 0, transparent 35%),
            #fdf5ef;
        color: #5b3b35;
        font-family: Georgia, "Times New Roman", serif;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
    }

    .page {
        width: 100%;
        max-width: 430px;
        min-height: 100vh;
        padding: 35px 22px;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .card {
        width: 100%;
        padding: 48px 27px;
        background: #fffaf6;
        border: 1px solid #d9aaa5;
        position: relative;
        box-shadow: 0 18px 50px rgba(91,59,53,0.14);
    }

    .card::before {
        content: "♡";
        position: absolute;
        top: 15px;
        left: 17px;
        color: #d09a98;
        font-size: 19px;
    }

    .card::after {
        content: "♡";
        position: absolute;
        bottom: 15px;
        right: 17px;
        color: #d09a98;
        font-size: 19px;
    }

    .corner {
        position: absolute;
        color: #d5a09c;
        font-size: 13px;
    }

    .top-right {
        top: 18px;
        right: 20px;
    }

    .bottom-left {
        bottom: 18px;
        left: 20px;
    }

    .small {
        font-size: 11px;
        letter-spacing: 4px;
        text-transform: uppercase;
        color: #9b6f68;
        margin-bottom: 20px;
    }

    .line {
        width: 55px;
        height: 1px;
        background: #cfa09a;
        margin: 0 auto 25px;
    }

    h1 {
        font-size: 48px;
        font-weight: normal;
        line-height: 1.15;
        color: #573630;
        margin: 0;
    }

    .name {
        font-size: 29px;
        font-style: italic;
        color: #8a5c57;
        margin-top: 12px;
    }

    .decor {
        color: #c98989;
        font-size: 22px;
        margin: 25px 0;
        letter-spacing: 5px;
    }

    .message {
        font-size: 17px;
        line-height: 1.8;
        color: #76534c;
        margin-bottom: 25px;
    }

    .little-note {
        font-size: 14px;
        line-height: 1.7;
        color: #9a716a;
        font-style: italic;
        margin-bottom: 30px;
    }

    .button {
        display: inline-block;
        padding: 16px 34px;
        background: #e8c3c0;
        color: #573630;
        text-decoration: none;
        border: 1px solid #c99590;
        border-radius: 30px;
        font-size: 16px;
    }

    .footer {
        margin-top: 25px;
        font-size: 10px;
        letter-spacing: 3px;
        color: #b0847d;
        text-transform: uppercase;
    }
</style>
</head>

<body>

<div class="page">

    <div class="card">

        <div class="corner top-right">✦</div>
        <div class="corner bottom-left">✦</div>

        <div class="small">
            The end... for now
        </div>

        <div class="line"></div>

        <h1>
            Happiest<br>
            Birthday
        </h1>

        <div class="name">
            Hemin ♡
        </div>

        <div class="decor">
            ♡ &nbsp; ✦ &nbsp; ♡
        </div>

        <div class="message">
            To my favourite person,<br>
            my favourite story,<br>
            and hopefully my favourite husband.
        </div>

        <div class="little-note">
            Two years down.<br>
            Hopefully a lifetime to go.
        </div>

        <a href="index.html" class="button">
            Start from the beginning ♡
        </a>

        <div class="footer">
            made with all my love · iddi
        </div>

    </div>

</div>

</body>
</html>
