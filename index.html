<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Hemin ♡</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background: #fdf5ef;
        color: #5b3b35;
        font-family: Georgia, "Times New Roman", serif;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
    }

    .page {
        width: 100%;
        max-width: 430px;
        min-height: 100vh;
        padding: 40px 28px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }

    .small {
        font-size: 13px;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #9b6f68;
        margin-bottom: 25px;
    }

    h1 {
        font-size: 48px;
        font-weight: normal;
        margin: 0 0 18px;
        color: #573630;
    }

    .heart {
        color: #c98989;
        font-size: 24px;
        margin-bottom: 25px;
    }

    p {
        font-size: 18px;
        line-height: 1.7;
        margin: 0 0 35px;
        color: #76534c;
    }

    button {
        border: 1px solid #b9857d;
        background: #e8c3c0;
        color: #573630;
        padding: 15px 35px;
        border-radius: 30px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        background: #dfb2ae;
    }
</style>
</head>

<body>

<div class="page">

    <div class="small">A little something for you</div>

    <h1>For Hemin</h1>

    <div class="heart">♡</div>

    <p>
        Two years, countless memories,<br>
        and somehow you still feel like my favourite person.
    </p>

    <button>Open ♡</button>

</div>

</body>
</html>
